<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Assistente IA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0618;color:#eef2ff}
  #scene{position:fixed;inset:0;z-index:0;display:block}
  .wordmark{position:fixed;top:50%;left:30%;transform:translate(-50%,-50%);z-index:10;
    font-size:clamp(1.6rem,3.6vw,3.1rem);font-weight:800;letter-spacing:-1px;white-space:nowrap;
    background:linear-gradient(180deg,#ffffff,#c7cfe0);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(180,190,220,.25);animation:flutuar 7s ease-in-out infinite}
  @keyframes flutuar{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}
  .brand{position:fixed;top:22px;left:4vw;z-index:20;font-weight:800;font-size:1.05rem;color:#fff;display:flex;align-items:center;gap:8px}
  .brand .raio{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#e8c06a,#c9922f);color:#2a1e00;font-size:14px}
  .top-nav{position:fixed;top:26px;right:4vw;z-index:20;display:flex;gap:22px;align-items:center}
  .top-nav{gap:30px}
  .top-nav .link{color:#dfe4f5;text-decoration:none;font-size:.92rem;font-weight:500;position:relative;transition:.2s}
  .top-nav .link:hover{color:#fff}
  .top-nav .entrar{color:#aeb6d0}
  .top-nav .btn{background:#6c4dff;color:#fff;padding:9px 22px;border-radius:9px;font-weight:600;font-size:.9rem;border:none;transition:.2s;box-shadow:0 6px 20px rgba(108,77,255,.35)}
  .top-nav .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(108,77,255,.5)}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="brand"><span class="raio">⚡</span>Meu Assistente IA</div>
  <div class="top-nav"><a href="#entrar">Entrar</a><a class="btn" href="#cadastro">Cadastrar</a></div>
  <div class="wordmark">Meu Assistente IA</div>

<script>
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

// cabeca de particulas (rosto frontal)
const facePts=[];
function inHead(x,y){
  const head=Math.pow(x/0.52,2)+Math.pow((y+0.30)/0.60,2)<1;
  const jaw=Math.pow(x/0.44,2)+Math.pow((y-0.16)/0.52,2)<1 && y>-0.15;
  const neck=Math.abs(x)<0.17 && y>0.42 && y<1.02;
  const shoulder=Math.pow(x/0.98,2)+Math.pow((y-1.22)/0.40,2)<1 && y>0.92;
  return head||jaw||neck||shoulder;
}
for(let y=-1.1;y<=1.4;y+=0.026)for(let x=-1;x<=1;x+=0.026){
  if(inHead(x,y)){
    // brilho: realca testa/bochechas/nariz (sugere traços)
    const feat=0.4+0.6*Math.exp(-((x*x*2.4)+Math.pow(y+0.18,2)*1.6));
    facePts.push({x,y,b:Math.min(1,feat)});
  }
}

// globo digital
const globePts=[];
for(let i=0;i<340;i++){const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;globePts.push({phi,theta});}
let rot=0;

// numeros flutuando ao infinito (binario) — em varias camadas de profundidade
const nums=[];
for(let i=0;i<180;i++)nums.push({x:Math.random(),y:Math.random(),z:Math.random(),sp:0.0008+Math.random()*0.0025,digit:Math.random()<0.5?'0':'1'});

// estrelas
const stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.2});

// NOSSAS FRASES circulando/aparecendo
const frases=[
  "Seu Assistente de IA pra WhatsApp",
  "Simples, Poderoso e Acessível",
  "O futuro do atendimento é inteligente",
  "Atende 24 horas por dia",
  "Nunca mais perca um cliente",
  "Responde em segundos",
  "Aprende com cada conversa",
  "Teste grátis por 7 dias",
  "Configure em 5 minutos",
  "No WhatsApp do seu negócio"
];
const fLive=[];
for(let i=0;i<12;i++){
  fLive.push({txt:frases[i%frases.length], x:Math.random()*0.62+0.03, y:Math.random(), z:Math.random(), vz:0.0016+Math.random()*0.0022, rot:(Math.random()-.5)*0.3});
}

function draw(){
  // fundo cosmo
  const bg=ctx.createRadialGradient(W*0.34,H*0.5,0,W*0.34,H*0.5,W*0.95);
  bg.addColorStop(0,'#1c0e3e');bg.addColorStop(0.5,'#0d0826');bg.addColorStop(1,'#070411');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // estrelas
  for(const s of stars){ctx.fillStyle='rgba(190,200,255,0.5)';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill();}

  // numeros flutuando ao infinito (profundidade)
  for(const n of nums){
    n.y-=n.sp*(0.4+n.z*1.4);
    if(n.y<-0.05){n.y=1.05;n.x=Math.random();n.z=Math.random();n.digit=Math.random()<0.5?'0':'1';}
    const sz=8+n.z*16, a=0.12+n.z*0.5;
    ctx.font=sz+'px monospace';
    ctx.fillStyle=`rgba(${140+n.z*80},${180+n.z*50},255,${a})`;
    ctx.fillText(n.digit,n.x*W,n.y*H);
  }

  // globo digital (direita)
  rot+=0.0022;
  const cx=W*0.70,cy=H*0.50,R=Math.min(W,H)*0.40;
  const proj=[];
  for(const p of globePts){
    const x=Math.sin(p.phi)*Math.cos(p.theta+rot),y=Math.cos(p.phi),z=Math.sin(p.phi)*Math.sin(p.theta+rot);
    proj.push({sx:cx+x*R*1.02,sy:cy+y*R*1.12,z});
  }
  ctx.lineWidth=0.5;
  for(let i=0;i<proj.length;i+=4){const a=proj[i],b=proj[(i+9)%proj.length];
    const dd=Math.hypot(a.sx-b.sx,a.sy-b.sy);
    if(dd<95){ctx.strokeStyle=`rgba(90,160,240,${0.10+(a.z+1)*0.06})`;ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();}}
  for(const p of proj){const s=1.1+(p.z+1)*0.6;ctx.fillStyle=`rgba(120,180,255,${0.22+(p.z+1)*0.16})`;
    ctx.beginPath();ctx.arc(p.sx,p.sy,s,0,6.28);ctx.fill();}

  // rosto de particulas (direita, na frente do globo)
  const t=Date.now()*0.001;
  for(const p of facePts){
    const wob=Math.sin(t*1.2+p.x*7+p.y*7)*1.3;
    const sx=cx+p.x*R*0.72+wob, sy=cy+p.y*R*0.80+Math.cos(t+p.x*6)*1.1;
    const a=0.32+p.b*0.62, size=1.0+p.b*1.5;
    ctx.fillStyle=p.b>0.82?`rgba(235,242,255,${a})`:`rgba(140,195,255,${a})`;
    ctx.beginPath();ctx.arc(sx,sy,size,0,6.28);ctx.fill();
  }
  const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
  hg.addColorStop(0,'rgba(120,180,255,0.12)');hg.addColorStop(1,'transparent');
  ctx.fillStyle=hg;ctx.fillRect(cx-R,cy-R,R*2,R*2);

  // NOSSAS FRASES surgindo do infinito (profundidade)
  ctx.textAlign='left';
  for(const f of fLive){
    f.z+=f.vz;
    if(f.z>1){ f.z=0; f.x=Math.random()*0.66+0.02; f.y=0.15+Math.random()*0.7; f.txt=frases[Math.floor(Math.random()*frases.length)]; }
    // z: 0 = longe (fundo), 1 = perto. surge crescendo
    const depth=f.z;
    const scale=0.35+depth*1.15;
    const alpha=Math.min(1, depth*2.2) * (1-Math.max(0,(depth-0.86)/0.14));
    if(alpha>0.01){
      const sz=26*scale;
      ctx.save();
      ctx.translate(f.x*W, f.y*H);
      ctx.globalAlpha=alpha;
      ctx.font=`600 ${sz}px 'Segoe UI',sans-serif`;
      ctx.fillStyle='rgba(220,226,255,1)';
      ctx.shadowColor='rgba(130,160,255,0.55)';ctx.shadowBlur=14*depth;
      ctx.fillText(f.txt, 0, 0);
      ctx.restore();
    }
  }
  ctx.textAlign='center';
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
