<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente IA</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#06030d;color:#eef2ff}
#fx{position:fixed;inset:0;z-index:0;display:block}
.brand{position:fixed;top:22px;left:4vw;z-index:20;display:flex;align-items:center;gap:11px}
.brandtxt{font-size:1.12rem;font-weight:800}.brandtxt b{color:#eef2ff}.brandtxt span{background:linear-gradient(180deg,#7fe0ff,#3a86ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:5px}
.top-nav{position:fixed;top:22px;right:4vw;z-index:20;display:flex;gap:24px;align-items:center}
.top-nav .link{color:#c8d2e6;text-decoration:none;font-size:.92rem}.top-nav .entrar{color:#96a2bc}
.top-nav .btn{background:linear-gradient(120deg,#3a86ff,#5ad2ff);color:#fff;padding:10px 22px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:0 8px 26px rgba(58,134,255,.45)}
.hero{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;animation:flutuar 9s ease-in-out infinite}
.wm{font-size:clamp(1.7rem,3.4vw,2.9rem);font-weight:600;letter-spacing:1px;color:rgba(220,228,245,0.55)}
@keyframes flutuar{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-53%)}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="brand"><svg width="30" height="30" viewBox="0 0 48 48" fill="none"><rect x="4" y="4" width="40" height="40" rx="12" stroke="#5ad2ff" stroke-width="1.6" fill="none" opacity="0.8"/><circle cx="24" cy="24" r="5.5" fill="#5ad2ff"/></svg><div class="brandtxt"><b>Meu Assistente</b><span>IA</span></div></div>
<div class="top-nav"><a class="link" href="#r">Recursos</a><a class="link" href="#p">Planos</a><a class="link" href="#c">Como funciona</a><a class="link entrar" href="#e">Entrar</a><a class="btn" href="#cad">Cadastrar</a></div>
<div class="hero"><div class="wm">Agente de IA</div></div>
<script src="head_pts.js"></script>
<script>
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const head=(window.HEAD_PTS||[]).map(a=>[a[0],a[1],a[2]]);
const globe=[];for(let i=0;i<180;i++){const p=Math.acos(2*Math.random()-1),t=Math.random()*6.28;globe.push([Math.sin(p)*Math.cos(t),Math.cos(p),Math.sin(p)*Math.sin(t)]);}
const bins=[];for(let i=0;i<70;i++)bins.push({x:Math.random(),y:Math.random(),z:Math.random(),vy:0.0006+Math.random()*0.002,d:Math.random()<0.5?'0':'1'});
let t0=Date.now();
function draw(){
  const rev=Math.min(1,(Date.now()-t0)/2600);
  const bg=x.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.95);
  bg.addColorStop(0,'#141a4a');bg.addColorStop(0.5,'#0e0a30');bg.addColorStop(1,'#06030d');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const t=Date.now()*0.0004, gcx=W*0.5,gcy=H*0.54,R=Math.min(W,H)*0.30;
  for(const g of globe){const gx=g[0]*Math.cos(t*0.5)-g[2]*Math.sin(t*0.5),gz=g[0]*Math.sin(t*0.5)+g[2]*Math.cos(t*0.5);
    x.fillStyle=`rgba(80,150,240,${(0.10+(gz+1)*0.12)*rev})`;x.beginPath();x.arc(gcx+gx*R*1.5,gcy+g[1]*R*1.5,1.1,0,6.28);x.fill();}
  for(let i=0;i<head.length;i+=2){const h=head[i];
    const sx=gcx+h[0]*R*1.5, sy=gcy-h[1]*R*1.5+h[2]*R*0.1;
    const a=(0.55+(h[2]+1)*0.28)*rev, sz=1.3+(h[2]+1)*0.85;
    x.fillStyle=`rgba(195,230,255,${a})`;x.beginPath();x.arc(sx,sy,sz*1.4,0,6.28);x.fill();}
  for(const b of bins){b.y-=b.vy*(0.5+b.z*1.4);if(b.y<-0.05){b.y=1.05;b.x=Math.random();b.d=Math.random()<0.5?'0':'1';}
    x.font=`${10+b.z*15}px monospace`;x.fillStyle=`rgba(160,210,255,${(0.15+b.z*0.45)*rev})`;x.fillText(b.d,b.x*W,b.y*H);}
  requestAnimationFrame(draw);
}draw();
</script></body></html>
