<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Assistente IA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#070411;color:#eef2ff}
  #bg{position:fixed;inset:0;z-index:0;background:url('cabeca_blender.png') center/cover no-repeat}
  #fx{position:fixed;inset:0;z-index:1;display:block;pointer-events:none}
  .brand{position:fixed;top:22px;left:4vw;z-index:20;display:flex;align-items:center;gap:12px}
  .brand svg{filter:drop-shadow(0 0 12px rgba(120,180,255,.5))}
  .brandtxt{font-size:1.15rem;font-weight:800;line-height:1}
  .brandtxt b{color:#eef2ff}.brandtxt span{background:linear-gradient(180deg,#8fe0ff,#6c4dff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:6px}
  .top-nav{position:fixed;top:22px;right:4vw;z-index:20;display:flex;gap:26px;align-items:center}
  .top-nav .link{color:#dfe4f5;text-decoration:none;font-size:.92rem;font-weight:500}
  .top-nav .entrar{color:#aeb6d0}
  .top-nav .btn{background:linear-gradient(120deg,#6c4dff,#8a5cff);color:#fff;padding:10px 22px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:0 8px 24px rgba(108,77,255,.42)}
  .hero-center{position:fixed;top:50%;left:30%;transform:translate(-50%,-50%);z-index:10;text-align:left;animation:flutuar 8s ease-in-out infinite}
  .wm-line{font-size:clamp(2rem,4.6vw,3.9rem);font-weight:800;letter-spacing:-1.2px;line-height:1.02;
    background:linear-gradient(180deg,#ffffff,#b9c3d6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 10px 50px rgba(140,160,220,.2)}
  .wm-accent{background:linear-gradient(180deg,#8fe0ff,#6c4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wm-underline{width:120px;height:3px;border-radius:3px;margin:20px 0 16px;background:linear-gradient(90deg,#6c4dff,#8fe0ff);box-shadow:0 0 22px rgba(120,120,255,.55)}
  .wm-sub{font-size:clamp(.95rem,1.5vw,1.28rem);color:#c0c8e2;letter-spacing:.3px}
  @keyframes flutuar{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-55%)}}
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="fx"></canvas>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe0ff"/><stop offset="1" stop-color="#6c4dff"/></linearGradient></defs>
      <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#lg)" opacity="0.16"/>
      <rect x="4" y="4" width="40" height="40" rx="12" stroke="url(#lg)" stroke-width="1.6" fill="none"/>
      <circle cx="24" cy="24" r="5.5" fill="url(#lg)"/><circle cx="24" cy="24" r="11" stroke="url(#lg)" stroke-width="1.4" opacity="0.7" fill="none"/>
    </svg>
    <div class="brandtxt"><b>Meu Assistente</b><span>IA</span></div>
  </div>
  <div class="top-nav"><a class="link" href="#recursos">Recursos</a><a class="link" href="#pricing">Planos</a><a class="link" href="#como">Como funciona</a><a class="link entrar" href="#entrar">Entrar</a><a class="btn" href="#cadastro">Cadastrar</a></div>
  <div class="hero-center">
    <div class="wm-line">Meu Assistente</div>
    <div class="wm-line wm-accent">IA</div>
    <div class="wm-underline"></div>
    <div class="wm-sub">Seu assistente de IA</div>
  </div>

<script>
const canvas=document.getElementById('fx'); const ctx=canvas.getContext('2d');
let W,H; function rs(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;} rs(); addEventListener('resize',rs);
const frases=["Seu Assistente IA","Simples, Poderoso e Acessível","O futuro do atendimento é inteligente","Atende 24 horas por dia","Nunca mais perca um cliente","Teste grátis por 7 dias"];
const fl=[];for(let i=0;i<7;i++)fl.push({txt:frases[i%frases.length],x:Math.random()*0.55+0.03,y:0.12+Math.random()*0.72,z:Math.random(),vz:0.0012+Math.random()*0.0016});
const nums=[];for(let i=0;i<40;i++)nums.push({x:Math.random(),y:Math.random(),z:Math.random(),sp:0.0008+Math.random()*0.0025,d:Math.random()<0.5?'0':'1'});
const beams=[];for(let i=0;i<3;i++)beams.push({x:Math.random()*0.42+0.01,w:1.5+Math.random()*2.5,sp:0.0006+Math.random()*0.0014,y:Math.random()});
const bokeh=[];for(let i=0;i<10;i++)bokeh.push({x:Math.random(),y:Math.random(),r:8+Math.random()*22,sp:0.0004+Math.random()*0.0009,hue:Math.random()<0.5?'160,110,255':'120,200,255'});
function draw(){
  ctx.clearRect(0,0,W,H);
  // feixes roxos
  for(const b of beams){ b.y-=b.sp; if(b.y<-0.2){b.y=1.2;b.x=Math.random()*0.42+0.01;}
    const g=ctx.createLinearGradient(0,b.y*H-140,0,b.y*H+140);
    g.addColorStop(0,'rgba(160,100,255,0)');g.addColorStop(0.5,'rgba(160,100,255,0.22)');g.addColorStop(1,'rgba(160,100,255,0)');
    ctx.fillStyle=g;ctx.fillRect(b.x*W,(b.y-0.28)*H,b.w*8,0.56*H); }
  // bokeh
  for(const k of bokeh){ k.y-=k.sp; if(k.y<-0.1){k.y=1.1;k.x=Math.random();k.r=8+Math.random()*22;}
    const rg=ctx.createRadialGradient(k.x*W,k.y*H,0,k.x*W,k.y*H,k.r);
    rg.addColorStop(0,`rgba(${k.hue},0.14)`);rg.addColorStop(1,`rgba(${k.hue},0)`);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(k.x*W,k.y*H,k.r,0,6.28);ctx.fill(); }
  // codigos flutuantes
  for(const n of nums){ n.y-=n.sp*(0.5+n.z*1.6); if(n.y<-0.05){n.y=1.05;n.x=Math.random();n.z=Math.random();n.d=Math.random()<0.5?'0':'1';}
    const sz=10+n.z*16,a=0.30+n.z*0.5; ctx.font=`${sz}px monospace`; ctx.shadowColor='rgba(120,180,255,0.7)';ctx.shadowBlur=10;
    ctx.fillStyle=`rgba(${170+n.z*60},${210+n.z*40},255,${a})`; ctx.fillText(n.d,n.x*W,n.y*H); ctx.shadowBlur=0; }
  // letras surgindo de longe
  for(const f of fl){ f.z+=f.vz; if(f.z>1){f.z=0;f.x=Math.random()*0.55+0.03;f.y=0.12+Math.random()*0.72;f.txt=frases[Math.floor(Math.random()*frases.length)];}
    const depth=f.z, scale=0.4+depth*1.25;
    const alpha=Math.min(1,depth*2.6)*(1-Math.max(0,(depth-0.9)/0.1));
    const sz=24*scale;
    ctx.save(); ctx.translate(f.x*W,f.y*H); ctx.globalAlpha=alpha;
    ctx.font=`600 ${sz}px 'Segoe UI',sans-serif`; ctx.fillStyle='#eef2ff';
    ctx.shadowColor='rgba(140,180,255,0.9)';ctx.shadowBlur=18*depth; ctx.fillText(f.txt,0,0); ctx.restore(); }
  requestAnimationFrame(draw);
}
draw();
</script>
<script>
(function(){
  var E='https://painel.omeuassistenteia.com.br/api/track';
  function s(d){try{fetch(E,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),keepalive:true}).catch(function(){});}catch(e){}}
  s({tipo:'pagina',pagina:location.pathname});
  document.addEventListener('click',function(ev){var a=ev.target.closest('a,button,[role="button"],.btn');if(a)s({tipo:'clique',pagina:location.pathname,elemento:(a.innerText||a.id||a.className||'x').toString().slice(0,60)});},true);
  window.registrarCadastro=function(email){s({tipo:'cadastro',pagina:location.pathname,email:email||''});};
  window.registrarPagamento=function(email,plano){s({tipo:'pagamento',pagina:location.pathname,email:email||'',elemento:plano||''});};
})();
</script>
</body>
</html>
