<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Meu Assistente IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#050510;color:#fff;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{padding:20px 0;background:rgba(5,5,16,0.95);border-bottom:1px solid rgba(251,191,36,0.3)}
nav{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;background:linear-gradient(135deg,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
main{max-width:440px;margin:0 auto;padding:50px 20px;width:100%}
h1{font-size:28px;text-align:center;margin-bottom:25px;background:linear-gradient(135deg,#fbbf24,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(124,58,237,0.15);border:1px solid rgba(251,191,36,0.3);border-radius:18px;padding:32px}
label{display:block;color:#fbbf24;font-weight:bold;margin-bottom:8px;font-size:14px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid rgba(251,191,36,0.3);background:rgba(255,255,255,0.08);color:#fff;font-size:15px;margin-bottom:18px}
input:focus{outline:none;border-color:#fbbf24}
.btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899,#f97316);color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
.erro{color:#ff6b6b;text-align:center;margin-top:12px;min-height:20px}
.link{text-align:center;margin-top:18px;color:#b0b0c0;font-size:14px}
.link a{color:#fbbf24}
</style>
</head>
<body>
<header><nav><a class="logo" href="index.html">Meu Assistente IA</a></nav></header>
<main>
<h1>Entrar na sua conta</h1>
<div class="card">
  <label>E-mail</label>
  <input type="email" id="email" placeholder="voce@email.com">
  <label>Senha</label>
  <input type="password" id="senha" placeholder="sua senha">
  <button class="btn" onclick="entrar()">Entrar</button>
  <div class="erro" id="erro"></div>
</div>
<div class="link">Ainda nao tem conta? <a href="cadastro-pro.html">Cadastre-se</a></div>
</main>
<script>
function entrar(){
  const email=document.getElementById('email').value;
  const senha=document.getElementById('senha').value;
  fetch('https://sistema-assistente-ia.onrender.com/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){
      localStorage.setItem('cliente', JSON.stringify({id:d.id, nome:d.nome, token:d.token}));
      window.location.href='painel.html';
    } else {
      document.getElementById('erro').textContent=d.erro||'erro ao entrar';
    }
  }).catch(()=>{document.getElementById('erro').textContent='erro de conexao';});
}
</script>
<script>
document.addEventListener('contextmenu', e => { if(e.target.tagName==='IMG') e.preventDefault(); });
document.addEventListener('dragstart', e => { if(e.target.tagName==='IMG') e.preventDefault(); });
document.addEventListener('copy', e => { if(window.getSelection && !window.getSelection().toString()) e.preventDefault(); });
</script>
<style>img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}</style></body>
</html>
