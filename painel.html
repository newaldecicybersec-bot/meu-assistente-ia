<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Painel - Meu Assistente IA</title>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070d; color: #eaf2ff; line-height: 1.7; }
        header { padding: 18px 0; background: rgba(7,12,20,0.92); border-bottom: 1px solid rgba(255,255,255,0.09); backdrop-filter: blur(10px); }
        nav { max-width: 1040px; margin: 0 auto; padding: 0 22px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo .raio { color: #f4c15a; font-size: 25px; filter: drop-shadow(0 0 9px rgba(244,193,90,.55)); }
        .logo b { background: linear-gradient(90deg,#fff,#cfe9ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 11px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; background: linear-gradient(120deg,#f4c15a,#e8a93a); color: #241700; box-shadow: 0 8px 26px rgba(244,193,90,.28); }
        main { max-width: 1040px; margin: 0 auto; padding: 60px 22px; }
        h1 { font-size: 38px; color:#eef3f9; margin-bottom: 30px; }
        h2 { color: #d6dfe9; font-size: 24px; margin: 35px 0 15px; }
        p { color: #bcd4e2; margin-bottom: 15px; font-size: 17px; }
        ul { margin: 15px 0 25px 30px; }
        li { color: #bcd4e2; margin-bottom: 10px; font-size: 17px; }
        strong { color: #eaf2ff; }
        .card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 30px; margin: 25px 0; }
        a { color: #86b3c9; }
        footer { padding: 35px 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.09); background: rgba(4,7,12,0.9); margin-top: 60px; }
        footer p { color: #7d97a8; font-size: 14px; margin: 6px 0; }
    </style>
</head>
<body>
<header><nav><a class="logo" href="index.html"><span class="raio">⚡</span><b>Meu Assistente IA</b></a></nav></header>
<main>
<h1>Meu Painel de Consumo</h1>
<div class="card">
  <div class="linha"><span>Cliente</span><strong id="nome">-</strong></div>
  <div class="linha"><span>Plano</span><strong id="plano">-</strong></div>
  <div class="linha"><span>Mensagens usadas</span><span class="destaque" id="usado">0</span></div>
  <div class="barra"><div class="preenchido" id="barra" style="width:0%"></div></div>
  <div class="linha"><span>Restante</span><strong id="restante">-</strong></div>
  <a class="btn" href="index.html#pricing">Fazer upgrade</a>
</div>
</main>
<script>
const cliente = JSON.parse(localStorage.getItem('cliente')||'{}');
if(!cliente.token){ window.location.href='login.html'; }
document.getElementById('nome').textContent = cliente.nome || '-';
document.getElementById('plano').textContent = (cliente.plano||'basico').toUpperCase();
fetch('https://sistema-assistente-ia.onrender.com/api/saldo/'+cliente.id, {headers:{'Authorization':'Bearer '+cliente.token}})
.then(r=>r.json()).then(d=>{
  if(d.erro){ window.location.href='login.html'; return; }
  document.getElementById('usado').textContent = d.usado;
  document.getElementById('restante').textContent = d.restante + ' de ' + d.limite;
  document.getElementById('barra').style.width = Math.min(100, (d.usado/d.limite*100)) + '%';
}).catch(()=>{});
</script>
<script>
document.addEventListener('contextmenu', e => { if(e.target.tagName==='IMG') e.preventDefault(); });
document.addEventListener('dragstart', e => { if(e.target.tagName==='IMG') e.preventDefault(); });
document.addEventListener('copy', e => { if(window.getSelection && !window.getSelection().toString()) e.preventDefault(); });
</script>
<style>img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}</style></body>
</html>
