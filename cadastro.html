<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Meu Assistente IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#050510;color:#fff;line-height:1.7;min-height:100vh}
header{padding:20px 0;background:rgba(5,5,16,0.95);border-bottom:1px solid rgba(251,191,36,0.3)}
nav{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;background:linear-gradient(135deg,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:50px 20px}
h1{font-size:32px;background:linear-gradient(135deg,#fbbf24,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;text-align:center}
.sub{color:#b0b0c0;text-align:center;margin-bottom:35px}
.card{background:rgba(124,58,237,0.15);border:1px solid rgba(251,191,36,0.3);border-radius:18px;padding:35px}
label{display:block;color:#fbbf24;font-weight:bold;margin-bottom:8px;font-size:15px}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(251,191,36,0.3);background:rgba(255,255,255,0.08);color:#fff;font-size:16px;margin-bottom:20px}
input:focus,select:focus{outline:none;border-color:#fbbf24}
.btn{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899,#f97316);color:#fff;font-size:18px;font-weight:bold;cursor:pointer;transition:0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(249,115,22,0.4)}
.note{color:#888;font-size:13px;text-align:center;margin-top:18px}
.etapas{display:flex;justify-content:center;gap:20px;margin-bottom:30px}
.etapa{text-align:center;color:#888;font-size:13px}
.etapa.ativo{color:#fbbf24}
.etapa-num{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:bold}
.etapa.ativo .etapa-num{background:#fbbf24;color:#1a1a2e}
</style>
</head>
<body>
<header><nav><a class="logo" href="index.html">⚡ Meu Assistente IA</a></nav></header>
<main>
<div class="etapas">
  <div class="etapa ativo"><div class="etapa-num">1</div>Cadastro</div>
  <div class="etapa"><div class="etapa-num">2</div>Pagamento</div>
  <div class="etapa"><div class="etapa-num">3</div>Pronto!</div>
</div>
<h1>Crie sua conta</h1>
<p class="sub">Falta pouco para seu assistente de IA começar a trabalhar!</p>
<div class="card">
<form id="formCadastro">
<label>Nome completo</label>
<input type="text" id="nome" required placeholder="Seu nome">
<label>E-mail</label>
<input type="email" id="email" required placeholder="voce@email.com">
<label>Plano escolhido</label>
<select id="plano">
<option value="basico">Plano Básico — R$ 29/mês</option>
<option value="profissional">Plano Profissional — R$ 59/mês</option>
<option value="empresarial">Plano Empresarial — R$ 149/mês</option>
</select>
<button type="submit" class="btn">Continuar para Pagamento →</button>
</form>
<p class="note">🔒 Seus dados estão protegidos pela LGPD.<br>Você receberá um e-mail de confirmação após o cadastro.</p>
</div>
</main>
<script>
const links = {
  basico: "https://mpago.la/2hNTSQS",
  profissional: "https://mpago.la/24sufMk",
  empresarial: "https://mpago.la/1aMdqZJ"
};
const params = new URLSearchParams(window.location.search);
const plano = params.get("plano");
if (plano && links[plano]) document.getElementById("plano").value = plano;
document.getElementById("formCadastro").addEventListener("submit", function(e) {
  e.preventDefault();
  const nome = document.getElementById("nome").value;
  const email = document.getElementById("email").value;
  const escolhido = document.getElementById("plano").value;
  localStorage.setItem("cliente", JSON.stringify({nome, email, plano: escolhido, data: new Date().toISOString()}));
  window.location.href = links[escolhido];
});
</script>
</body>
</html>
