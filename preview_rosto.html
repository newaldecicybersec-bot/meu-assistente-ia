<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Assistente IA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0618;color:#eef2ff}
  #scene{position:fixed;inset:0;z-index:0;display:block}
  .wordmark{position:fixed;top:50%;left:31%;transform:translate(-50%,-50%);z-index:10;
    font-size:clamp(2.6rem,7vw,6rem);font-weight:800;letter-spacing:-2px;white-space:nowrap;
    background:linear-gradient(180deg,#ffffff,#c7cfe0);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(180,190,220,.25);animation:flutuar 7s ease-in-out infinite}
  @keyframes flutuar{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}
  .top-nav{position:fixed;top:26px;right:4vw;z-index:20;display:flex;gap:22px;align-items:center}
  .top-nav a{color:#c3c8e0;text-decoration:none;font-size:.92rem;font-weight:500}
  .top-nav .btn{background:#fff;color:#1a1030;padding:10px 22px;border-radius:22px;font-weight:700}
  .brand{position:fixed;top:24px;left:4vw;z-index:20;font-weight:900;font-size:1.35rem;color:#fff;display:flex;align-items:center;gap:8px}
  .brand .raio{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#e8c06a,#c9922f);color:#2a1e00;font-size:17px}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="brand"><span class="raio">⚡</span>Meu Assistente IA</div>
  <div class="top-nav"><a href="#entrar">Entrar</a><a class="btn" href="#cadastro">Cadastrar</a></div>
  <div class="wordmark">Meu Assistente IA</div>

<script>
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W,H,cx,cy;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;cx=W*0.70;cy=H*0.50;}
resize();addEventListener('resize',resize);

// ROSTO frontal feito de particulas (pontos) — cabeca + pescoco + ombros
const facePts=[];
function inHead(x,y){ // x,y normalizados -1..1, cabeca frontal
  // cranio
  const head=Math.pow(x/0.52,2)+Math.pow((y+0.32)/0.62,2) < 1;
  // rosto/queixo (abaixo do cranio, mais estreito)
  const jaw=Math.pow(x/0.42,2)+Math.pow((y-0.18)/0.55,2) < 1 && y>-0.1;
  // pescoco
  const neck=Math.abs(x)<0.18 && y>0.45 && y<1.05;
  // ombros
  const shoulders=Math.pow(x/0.95,2)+Math.pow((y-1.25)/0.42,2) < 1 && y>0.95;
  return head||jaw||neck||shoulders;
}
for(let y=-1.1;y<=1.45;y+=0.028){
  for(let x=-1.0;x<=1.0;x+=0.028){
    if(inHead(x,y)){
      // brilho: mais claro onde seriam os traços (testa/bochechas)
      const feat=0.45+0.55*Math.exp(-((x*x*2.2)+(Math.pow(y+0.15,2))*1.4));
      facePts.push({x,y,b:Math.min(1,feat)});
    }
  }
}

// globo digital (pontos em esfera, atras do rosto)
const globePts=[];
for(let i=0;i<360;i++){
  const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;
  globePts.push({phi,theta});
}
let rot=0;

// estrelas
const stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.2});

// binario + brilhos roxos na esquerda
const bins=[];for(let i=0;i<22;i++)bins.push({x:Math.random()*0.34,y:Math.random(),sp:0.0015+Math.random()*0.003,sz:Math.random()*10+8});
const sparks=[];for(let i=0;i<60;i++)sparks.push({x:Math.random()*0.36,y:Math.random(),vy:-(Math.random()*0.002+0.0006),r:Math.random()*2.4+.6});

function draw(){
  // fundo cosmo
  const bg=ctx.createRadialGradient(W*0.35,H*0.5,0,W*0.35,H*0.5,W*0.9);
  bg.addColorStop(0,'#1a0c3a');bg.addColorStop(0.55,'#0c0824');bg.addColorStop(1,'#070512');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // estrelas
  for(const s of stars){ctx.fillStyle='rgba(190,200,255,0.55)';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill();}

  // brilhos roxos subindo (esquerda)
  for(const s of sparks){s.y+=s.vy;if(s.y<0){s.y=1;s.x=Math.random()*0.36;}
    ctx.fillStyle=`rgba(180,120,255,${0.5+Math.random()*0.3})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill();}

  // binario na esquerda
  ctx.font='13px monospace';
  for(const b of bins){b.y+=b.sp;if(b.y>1.1)b.y=-0.05;
    ctx.fillStyle='rgba(120,150,230,0.5)';ctx.fillText(Math.random()<0.5?'0':'1',b.x*W,b.y*H);}

  // globo digital atras do rosto
  rot+=0.0022;
  const R=Math.min(W,H)*0.40;
  const proj=[];
  for(const p of globePts){
    const x=Math.sin(p.phi)*Math.cos(p.theta+rot),y=Math.cos(p.phi),z=Math.sin(p.phi)*Math.sin(p.theta+rot);
    proj.push({sx:cx+x*R*1.02,sy:cy+y*R*1.12,z});
  }
  // linhas do globo (rede)
  ctx.lineWidth=0.5;
  for(let i=0;i<proj.length;i+=4){const a=proj[i],b=proj[(i+9)%proj.length];
    const dd=Math.hypot(a.sx-b.sx,a.sy-b.sy);
    if(dd<95){ctx.strokeStyle=`rgba(90,160,240,${0.10+ (a.z+1)*0.06})`;ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();}}
  for(const p of proj){const s=1.1+(p.z+1)*0.6;ctx.fillStyle=`rgba(120,180,255,${0.25+(p.z+1)*0.18})`;
    ctx.beginPath();ctx.arc(p.sx,p.sy,s,0,6.28);ctx.fill();}

  // ROSTO de particulas (na frente do globo)
  const t=Date.now()*0.001;
  for(const p of facePts){
    const wob=Math.sin(t*1.2+p.x*7+p.y*7)*1.4;
    const sx=cx+p.x*R*0.72+wob;
    const sy=cy+p.y*R*0.80+Math.cos(t+p.x*6)*1.1;
    const a=0.35+p.b*0.6;
    const size=1.0+p.b*1.5;
    ctx.fillStyle=p.b>0.8?`rgba(235,240,255,${a})`:`rgba(150,195,255,${a})`;
    ctx.beginPath();ctx.arc(sx,sy,size,0,6.28);ctx.fill();
  }
  // aura do rosto
  const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
  hg.addColorStop(0,'rgba(120,180,255,0.12)');hg.addColorStop(1,'transparent');
  ctx.fillStyle=hg;ctx.fillRect(cx-R,cy-R,R*2,R*2);

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
