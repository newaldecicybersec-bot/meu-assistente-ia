<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crescimento - Meu Assistente IA</title>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070d; color: #eaf2ff; line-height: 1.7; }
        header { padding: 18px 0; background: rgba(7,12,20,0.92); border-bottom: 1px solid rgba(30,220,190,0.16); backdrop-filter: blur(10px); }
        nav { max-width: 1040px; margin: 0 auto; padding: 0 22px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo .raio { color: #f4c15a; font-size: 25px; filter: drop-shadow(0 0 9px rgba(244,193,90,.55)); }
        .logo b { background: linear-gradient(90deg,#fff,#cfe9ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 11px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; background: linear-gradient(120deg,#16e0b4,#0fb0c9); color: #04121a; box-shadow: 0 8px 26px rgba(18,224,182,.34); }
        main { max-width: 1040px; margin: 0 auto; padding: 60px 22px; }
        h1 { font-size: 38px; background: linear-gradient(90deg,#2fe0c0,#4fd6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        h2 { color: #2fe0c0; font-size: 24px; margin: 35px 0 15px; }
        p { color: #bcd4e2; margin-bottom: 15px; font-size: 17px; }
        ul { margin: 15px 0 25px 30px; }
        li { color: #bcd4e2; margin-bottom: 10px; font-size: 17px; }
        strong { color: #eaf2ff; }
        .card { background: rgba(18,224,182,0.07); border: 1px solid rgba(30,220,190,0.20); border-radius: 16px; padding: 30px; margin: 25px 0; }
        a { color: #2fe0c0; }
        footer { padding: 35px 0; text-align: center; border-top: 1px solid rgba(30,220,190,0.16); background: rgba(4,7,12,0.9); margin-top: 60px; }
        footer p { color: #7d97a8; font-size: 14px; margin: 6px 0; }
    </style>
</head>
<body>
<header><nav><div class="logo">Painel de Crescimento</div><div style="color:#888;font-size:13px">Meu Assistente IA</div></nav></header>
<main>
<h1>Crescimento do negocio</h1>
<p class="sub">Acompanhe seus clientes e receita em tempo real.</p>
<div class="grade">
  <div class="cartao"><div class="rot">Total de clientes</div><div class="num" id="total">-</div><div class="sub2">cadastrados</div></div>
  <div class="cartao"><div class="rot">Receita mensal</div><div class="num" id="receita">-</div><div class="sub2">recorrente</div></div>
  <div class="cartao"><div class="rot">Novos hoje</div><div class="num" id="novos">-</div><div class="sub2">cadastros de hoje</div></div>
</div>
<div class="card">
  <h2>Clientes por plano</h2>
  <div class="linha"><span>Basico (R$29)</span><strong id="basico">-</strong></div>
  <div class="linha"><span>Profissional (R$59)</span><strong id="profissional">-</strong></div>
  <div class="linha"><span>Empresarial (R$149)</span><strong id="empresarial">-</strong></div>
</div>
</main>
<script>
const params=new URLSearchParams(location.search);
const key=params.get('key')||'';
fetch('https://sistema-assistente-ia.onrender.com/api/admin/resumo',{headers:{'X-Admin-Key':key}})
.then(r=>r.json()).then(d=>{
  if(d.erro){document.body.innerHTML='<h1 style="padding:50px;color:#ff6b6b">Acesso negado</h1>';return;}
  document.getElementById('total').textContent=d.total_clientes;
  document.getElementById('receita').textContent='R$ '+d.receita_mensal;
  document.getElementById('novos').textContent=d.novos_hoje;
  const p=d.planos||{};
  document.getElementById('basico').textContent=p.basico||0;
  document.getElementById('profissional').textContent=p.profissional||0;
  document.getElementById('empresarial').textContent=p.empresarial||0;
});
</script>
</body>
</html>
